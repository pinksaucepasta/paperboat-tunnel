services:
  tunnel:
    image: ${PAPERBOAT_TUNNEL_IMAGE:?set PAPERBOAT_TUNNEL_IMAGE}
    restart: unless-stopped
    command:
      - -node-id
      - ${PAPERBOAT_TUNNEL_NODE_ID:?set PAPERBOAT_TUNNEL_NODE_ID}
      - -edge-pool
      - ${PAPERBOAT_TUNNEL_EDGE_POOL:-default}
      - -relay-id
      - ${PAPERBOAT_TUNNEL_RELAY_ID:?set PAPERBOAT_TUNNEL_RELAY_ID}
      - -relay-region
      - ${PAPERBOAT_TUNNEL_RELAY_REGION:?set PAPERBOAT_TUNNEL_RELAY_REGION}
      - -relay-name
      - ${PAPERBOAT_TUNNEL_RELAY_NAME:?set PAPERBOAT_TUNNEL_RELAY_NAME}
      - -health-address
      - 127.0.0.1:9090
      - -deployment-config
      - /etc/paperboat-tunnel/deployment.json
      - -state-path
      - /var/lib/paperboat-tunnel/state/state.json
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "26023:26023/tcp"
      - "26023:26023/udp"
      - "3478:3478/udp"
    volumes:
      - ./deployment.json:/etc/paperboat-tunnel/deployment.json:ro
      - ./secrets:/run/secrets:ro
      - tunnel-runtime:/var/lib/paperboat-tunnel/runtime
      - tunnel-state:/var/lib/paperboat-tunnel/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tunnel-runtime:
  tunnel-state:
