name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Fetch frp provenance tag
        run: |
          if test "$(git -C frp rev-parse --is-shallow-repository)" = true; then
            git -C frp fetch --unshallow origin
          fi
          git -C frp fetch https://github.com/fatedier/frp.git tag v0.70.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check race reproducible-builds binary-size-check static-analysis vulnerability-check license-check
